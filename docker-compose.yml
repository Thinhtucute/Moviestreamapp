version: "3.8"
services:
  db:
    build:
      context: ./Database
      dockerfile: Dockerfile
    container_name: moviestream_db
    environment:
      MYSQL_ROOT_PASSWORD: "1"
      MYSQL_DATABASE: "movie_streaming_app"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: moviestream_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/movie_streaming_app?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1"
      SERVER_PORT: 8080
      JWT_SIGNER_KEY: change_me
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: moviestream_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data: